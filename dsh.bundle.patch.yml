# 本层只干一件事：把插件插进 profile 的 Loader 行列表。
# 注意：profile 层覆盖该行时 config 会被整份替换（不深合并），改参数要写全。

- insert:
    - id: dsh-ebbing-context
      name: dsh-ebbing-context
      config:
        budget:
          l1: 0.10
          l2: 0.06
          l3: 0.03
        segment:
          l1: 5000
          l2: 2000
          l3: 5000
        triggerPct: 0.75
        keepTurns: 2
        notice:
          enabled: true
          growthTokens: 65000
          growthResetPct: 40
          notifySubagents: true
        title:
          maxTokens: 50
        requireSessionQuery: true
        pruneFirst: true
        foldCallRecord: true
        reservedTokens: 0
